name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 1. Decode the Base64 keystore secret back into release.jks
    - name: Decode Keystore
      run: |
        mkdir -p store-key-sign
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > store-key-sign/release.jks

    # 2. Create keystore.properties dynamically using your GitHub Secrets
    - name: Create keystore.properties
      run: |
        echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > keystore.properties
        echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
        echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
        echo "storeFile=store-key-sign/release.jks" >> keystore.properties

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iso-compressor-release-apk
        path: app/build/outputs/apk/release/*.apk
